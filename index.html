<section class="hero"><div><p class="eyebrow">英雄联盟 · 自定义内战</p><h1>每一次对位，<br>都藏着比赛的转折。</h1><p class="hero-copy">从 BP 到对位差，再到赛后锐评。选择任意场次合并统计、对比表现变化。</p></div><div class="series"><p class="eyebrow">所选比赛 · 地图侧胜场</p><div class="series-score"><span class="blue">蓝方</span><strong>— <em>:</em> —</strong><span class="red">红方</span></div><div class="series-dots"></div><p>蓝红为每场地图侧，队员可以跨场更换</p></div></section>
<div class="navigation"><nav aria-label="分析页面"><button data-view="overview" class="active">总览</button><button data-view="awards">赛后锐评</button><button data-view="players">选手表现</button><button data-view="draft">英雄 BP</button><button data-view="review">单局复盘</button><button data-view="compare">比赛对比</button><button data-view="methods">数据口径</button></nav><label class="scope">统计范围 <select id="scope" aria-label="统计比赛范围"><option value="all">全部比赛</option></select></label></div>
